  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="color-scheme" content="light dark">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
      background: light-dark(#f5f5f7, #000000);
      color: light-dark(#1d1d1f, #f5f5f7);
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .glass {
      background: light-dark(rgba(255,255,255,0.8), rgba(28,28,30,0.8));
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
    }

    .button {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .button:active {
      transform: scale(0.96);
    }

    .card {
      background: light-dark(#ffffff, #1c1c1e);
      border: 1px solid light-dark(rgba(0,0,0,0.1), rgba(255,255,255,0.1));
    }

    .leaflet-container {
      border-radius: 16px;
      overflow: hidden;
    }

    @media (prefers-color-scheme: dark) {
      .leaflet-tile {
        filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
      }
    }
  </style>
</head>
<body>

            { emoji: "🏔️", time: "En route", title: "Rogers Pass", note: "Glacier NP", lat: 51.305, lng: -117.527 },
            { emoji: "🏨", time: "Evening", title: "Boulder Mountain Resort", note: "1 night", lat: 50.999, lng: -118.196 }
          ]
        },
        {
          id: 11,
          date: "Wed Jun 24",

          emoji: "⛴️",
          color: "#34C759",
          items: [

    const fetchWeather = async (lat, lng) => {
      try {
        const response = await fetch(
          `https://api.open-meteo.com/v1/gem?latitude=${lat}&longitude=${lng}&daily=weathercode,temperature_2m_max,temperature_2m_min&temperature_unit=celsius&timezone=auto&forecast_days=7`
        );
        const data = await response.json();
        return data.daily;
      } catch (error) {
        console.error('Weather fetch error:', error);
        return null;
      }
    };

    const fetchTrailConditions = async (park) => {
      try {
        const response = await fetch(`/api/trail-conditions?park=${park}`);
        const data = await response.json();
        return data;
      } catch (error) {
        console.error('Trail conditions fetch error:', error);
        return null;
      }
    };

    const calculateDistance = (lat1, lng1, lat2, lng2) => {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng/2) * Math.sin(dLng/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    };

    const calculateTotalDistance = () => {
      const majorStops = [
        { lat: 48.428, lng: -123.365 }, // Victoria
        { lat: 49.888, lng: -119.496 }, // Kelowna
        { lat: 52.983, lng: -118.100 }, // Jasper
        { lat: 51.416, lng: -116.217 }, // Lake Louise
        { lat: 51.089, lng: -115.359 }, // Canmore
        { lat: 50.999, lng: -118.196 }, // Revelstoke
        { lat: 48.428, lng: -123.365 }  // Victoria
      ];

      let total = 0;
      for (let i = 0; i < majorStops.length - 1; i++) {
        total += calculateDistance(
          majorStops[i].lat, majorStops[i].lng,
          majorStops[i+1].lat, majorStops[i+1].lng
        );
      }
      return Math.round(total);
    };

    function DayMap({ items }) {
      const mapRef = useRef(null);
      const mapInstanceRef = useRef(null);

      useEffect(() => {
        if (!mapRef.current || mapInstanceRef.current) return;

        const validItems = items.filter(item => item.lat && item.lng);
        if (validItems.length === 0) return;

        const bounds = validItems.map(item => [item.lat, item.lng]);

        const map = L.map(mapRef.current, {
          scrollWheelZoom: false,
          dragging: true,
          touchZoom: true
        }).fitBounds(bounds, { padding: [30, 30] });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: ''
        }).addTo(map);

        validItems.forEach((item, idx) => {
          const marker = L.marker([item.lat, item.lng]).addTo(map);
          marker.bindPopup(`<b>${idx + 1}. ${item.title}</b>${item.note ? '<br>' + item.note : ''}`);
        });

        if (validItems.length > 1) {
          const polyline = L.polyline(bounds, {
            color: '#007AFF',
            weight: 3,
            opacity: 0.7
          }).addTo(map);
        }

        mapInstanceRef.current = map;

        return () => {
          if (mapInstanceRef.current) {
            mapInstanceRef.current.remove();
            mapInstanceRef.current = null;
          }
        };
      }, [items]);

      const validItems = items.filter(item => item.lat && item.lng);
      if (validItems.length === 0) return null;

      return <div ref={mapRef} style={{ height: '240px', borderRadius: '16px', marginBottom: '16px' }} />;
    }

    function OverviewMap({ days }) {
      const mapRef = useRef(null);
      const mapInstanceRef = useRef(null);

      useEffect(() => {
        if (!mapRef.current || mapInstanceRef.current) return;

        const allPoints = [];
        days.forEach(day => {
          day.items.forEach(item => {
            if (item.lat && item.lng) {
              allPoints.push({ ...item, day: day.title, color: day.color });
            }
          });
        });

        if (allPoints.length === 0) return;

        const bounds = allPoints.map(p => [p.lat, p.lng]);

        const map = L.map(mapRef.current, {
          scrollWheelZoom: false,
          dragging: true,
          touchZoom: true
        }).fitBounds(bounds, { padding: [40, 40] });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: ''
        }).addTo(map);

        allPoints.forEach(point => {
          const marker = L.marker([point.lat, point.lng]).addTo(map);
          marker.bindPopup(`<b>${point.title}</b><br>${point.day}${point.note ? '<br>' + point.note : ''}`);
        });

        mapInstanceRef.current = map;

        return () => {
          if (mapInstanceRef.current) {
            mapInstanceRef.current.remove();
            mapInstanceRef.current = null;
          }
        };
      }, [days]);

      return <div ref={mapRef} style={{ height: '400px', borderRadius: '16px', marginBottom: '24px' }} />;
    }

    function App() {
      const [selectedDay, setSelectedDay] = useState(null);
      const [mapProvider, setMapProvider] = useState('apple');
      const [weather, setWeather] = useState({});
      const [trailConditions, setTrailConditions] = useState({});
      const [showOverview, setShowOverview] = useState(false);
      const totalKm = calculateTotalDistance();

      useEffect(() => {
        TRIP_DATA.days.forEach(async (day) => {
          const firstLocation = day.items.find(item => item.lat && item.lng);
          if (firstLocation) {
            const data = await fetchWeather(firstLocation.lat, firstLocation.lng);
            if (data) {
              setWeather(prev => ({ ...prev, [day.id]: data }));
            }
          }

          if (day.park) {
            const conditions = await fetchTrailConditions(day.park);
            if (conditions) {
              setTrailConditions(prev => ({ ...prev, [day.park]: conditions }));
            }
          }
        });
      }, []);

      const getMapUrl = (lat, lng, label) => {
        if (mapProvider === 'apple') {
          return `http://maps.apple.com/?q=${encodeURIComponent(label)}&ll=${lat},${lng}`;
        } else {
          return `https://maps.google.com/?q=${encodeURIComponent(label)}&ll=${lat},${lng}`;
        }
      };

      const getWeatherEmoji = (code) => {
        if (code <= 3) return '☀️';
        if (code <= 49) return '☁️';
        if (code <= 69) return '🌧️';
        if (code <= 79) return '🌨️';
        return '⛈️';
      };

      const formatTemp = (temp) => Math.round(temp) + '°';

      return (
        <div style={{ minHeight: '100vh', paddingBottom: '40px' }}>
          <header className="glass" style={{
            padding: '24px 20px 20px',
            position: 'sticky',

            zIndex: 100,
            borderBottom: '1px solid light-dark(rgba(0,0,0,0.1), rgba(255,255,255,0.1))'
          }}>
            <div style={{
              fontSize: '11px',
              letterSpacing: '0.06em',
              color: 'light-dark(#86868b, #98989d)',
              textTransform: 'uppercase',
              marginBottom: '6px',
              textAlign: 'center',
              fontWeight: 600
            }}>
              {TRIP_DATA.dates}
            </div>
            <h1 style={{
              fontSize: '32px',
              fontWeight: 700,
              margin: '0 0 4px',
              textAlign: 'center',
              letterSpacing: '-0.02em'
            }}>
              {TRIP_DATA.title}
            </h1>
            <div style={{
              fontSize: '15px',
              color: 'light-dark(#86868b, #98989d)',
              textAlign: 'center',
              marginBottom: '16px',
              fontWeight: 500
            }}>
              {totalKm.toLocaleString()} km total
            </div>

            <div style={{ display: 'flex', gap: '8px', justifyContent: 'center', flexWrap: 'wrap' }}>
              <button
                className="button"
                onClick={() => setShowOverview(!showOverview)}
                style={{
                  padding: '10px 18px',
                  borderRadius: '12px',
                  border: 'none',
                  background: showOverview ? '#007AFF' : 'light-dark(#f5f5f7, #1c1c1e)',
                  color: showOverview ? '#ffffff' : 'light-dark(#1d1d1f, #f5f5f7)',
                  fontSize: '15px',
                  fontWeight: 600,
                  cursor: 'pointer',
                  minHeight: '44px'
                }}
              >
                🗺️ {showOverview ? 'Hide' : 'Show'} Route
              </button>
              <button
                className="button"
                onClick={() => setMapProvider(mapProvider === 'apple' ? 'google' : 'apple')}
                style={{
                  padding: '10px 18px',
                  borderRadius: '12px',
                  border: 'none',
                  background: 'light-dark(#f5f5f7, #1c1c1e)',
                  color: 'light-dark(#1d1d1f, #f5f5f7)',
                  fontSize: '15px',
                  fontWeight: 600,
                  cursor: 'pointer',
                  minHeight: '44px'
                }}
              >
                {mapProvider === 'apple' ? '🍎' : '🗺️'} {mapProvider === 'apple' ? 'Apple' : 'Google'} Maps
              </button>
            </div>
          </header>

          <div style={{ padding: '16px', maxWidth: '680px', margin: '0 auto' }}>
            {showOverview && (
              <div style={{ marginBottom: '24px' }}>
                <h2 style={{ fontSize: '22px', fontWeight: 700, marginBottom: '12px', letterSpacing: '-0.01em' }}>
                  Full Route Overview
                </h2>
                <OverviewMap days={TRIP_DATA.days} />
              </div>
            )}

            {TRIP_DATA.days.map(day => (
              <div
                key={day.id}
                className="card"
                style={{
                  borderRadius: '20px',
                  marginBottom: '12px',
                  overflow: 'hidden',
                  boxShadow: 'light-dark(0 2px 8px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.3))'
                }}
              >
                <div
                  onClick={() => setSelectedDay(selectedDay === day.id ? null : day.id)}
                  style={{
                    padding: '20px',
                    cursor: 'pointer',
                    display: 'flex',
                    alignItems: 'center',
                    gap: '16px',
                    minHeight: '48px'
                  }}
                >
                  <div style={{
                    fontSize: '34px',
                    flexShrink: 0
                  }}>
                    {day.emoji}
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{
                      fontSize: '13px',
                      color: 'light-dark(#86868b, #98989d)',
                      marginBottom: '2px',
                      fontWeight: 600
                    }}>
                      {day.date}
                    </div>
                    <div style={{
                      fontSize: '20px',
                      fontWeight: 700,
                      letterSpacing: '-0.01em',
                      marginBottom: '2px'
                    }}>
                      {day.title}
                    </div>
                    <div style={{
                      fontSize: '15px',
                      color: 'light-dark(#86868b, #98989d)'
                    }}>
                      {day.items.length} stops
                    </div>
                  </div>
                  <div style={{ fontSize: '24px', color: 'light-dark(#c7c7cc, #48484a)' }}>
                    {selectedDay === day.id ? '◀' : '▶'}
                  </div>
                </div>

                {selectedDay === day.id && (
                  <div style={{ padding: '0 20px 20px' }}>
                    <DayMap items={day.items} />

                    {weather[day.id] && (
                      <div style={{
                        background: 'light-dark(#f5f5f7, #2c2c2e)',
                        borderRadius: '14px',
                        padding: '14px',
                        marginBottom: '14px'
                      }}>
                        <div style={{
                          fontSize: '15px',
                          fontWeight: 600,
                          marginBottom: '10px',
                          color: 'light-dark(#1d1d1f, #f5f5f7)'
                        }}>
                          Weather
                        </div>
                        <div style={{ display: 'flex', gap: '8px', overflowX: 'auto', WebkitOverflowScrolling: 'touch' }}>
                          {weather[day.id].time.slice(0, 5).map((date, i) => (
                            <div key={date} style={{
                              background: 'light-dark(#ffffff, #1c1c1e)',
                              borderRadius: '10px',
                              padding: '10px',
                              minWidth: '70px',
                              textAlign: 'center'
                            }}>
                              <div style={{ fontSize: '11px', color: 'light-dark(#86868b, #98989d)', fontWeight: 600, marginBottom: '4px' }}>
                                {new Date(date).toLocaleDateString('en-US', { weekday: 'short' })}
                              </div>
                              <div style={{ fontSize: '28px', marginBottom: '4px' }}>
                                {getWeatherEmoji(weather[day.id].weathercode[i])}
                              </div>
                              <div style={{ fontSize: '17px', fontWeight: 700 }}>
                                {formatTemp(weather[day.id].temperature_2m_max[i])}
                              </div>
                              <div style={{ fontSize: '13px', color: 'light-dark(#86868b, #98989d)' }}>
                                {formatTemp(weather[day.id].temperature_2m_min[i])}
                              </div>
                            </div>
                          ))}
                        </div>
                        <div style={{ fontSize: '11px', color: 'light-dark(#86868b, #98989d)', marginTop: '8px', textAlign: 'center' }}>
                          Canadian GEM Model via Open-Meteo
                        </div>
                      </div>
                    )}

                    {day.park && (
                      <a
                        href={`https://parks.canada.ca/pn-np/ab/${day.park}/activ/experience/sentiers-trails/etat-sentiers-trail-conditions`}
                        target="_blank"
                        rel="noreferrer"
                        style={{
                          display: 'block',
                          background: 'light-dark(#f5f5f7, #2c2c2e)',
                          borderRadius: '14px',
                          padding: '14px',
                          marginBottom: '14px',
                          textDecoration: 'none',
                          color: 'inherit'
                        }}
                      >
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                          <div>
                            <div style={{ fontSize: '15px', fontWeight: 600, marginBottom: '4px' }}>
                              🥾 {day.park.charAt(0).toUpperCase() + day.park.slice(1)} Trail Conditions
                            </div>
                            {trailConditions[day.park] ? (
                              <>
                                <div style={{ fontSize: '17px', fontWeight: 700, marginBottom: '2px' }}>
                                  {trailConditions[day.park].status}
                                </div>
                                <div style={{ fontSize: '13px', color: 'light-dark(#86868b, #98989d)' }}>
                                  {trailConditions[day.park].summary}
                                </div>
                              </>
                            ) : (
                              <div style={{ fontSize: '13px', color: '#007AFF', fontWeight: 600 }}>
                                Loading conditions...
                              </div>
                            )}
                          </div>
                          <div style={{ fontSize: '20px', color: 'light-dark(#c7c7cc, #48484a)' }}>
                            →
                          </div>
                        </div>
                        {trailConditions[day.park]?.trails && trailConditions[day.park].trails.length > 0 && (
                          <div style={{ marginTop: '10px', paddingTop: '10px', borderTop: '1px solid light-dark(rgba(0,0,0,0.1), rgba(255,255,255,0.1))' }}>
                            {trailConditions[day.park].trails.slice(0, 5).map((trail, idx) => (
                              <div key={idx} style={{
                                fontSize: '13px',
                                color: 'light-dark(#1d1d1f, #f5f5f7)',
                                marginBottom: '4px',
                                display: 'flex',
                                justifyContent: 'space-between'
                              }}>
                                <span>{trail.name}</span>
                                <span style={{
                                  fontWeight: 600,
                                  color: trail.status.toLowerCase().includes('open') || trail.status.toLowerCase().includes('good')
                                    ? '#34C759'
                                    : trail.status.toLowerCase().includes('closed')
                                    ? '#FF3B30'
                                    : '#FF9500'
                                }}>
                                  {trail.status}
                                </span>
                              </div>
                            ))}
                          </div>
                        )}
                      </a>
                    )}

                    <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                      {day.items.map((item, idx) => (
                        <div
                          key={idx}
                          style={{
                            background: 'light-dark(#f5f5f7, #2c2c2e)',
                            borderRadius: '14px',
                            padding: '16px'
                          }}
                        >
                          <div style={{ display: 'flex', gap: '14px', alignItems: 'flex-start' }}>
                            <div style={{ fontSize: '28px', flexShrink: 0 }}>
                              {item.emoji}
                            </div>
                            <div style={{ flex: 1 }}>
                              {item.time && (
                                <div style={{
                                  fontSize: '13px',
                                  color: 'light-dark(#86868b, #98989d)',
                                  marginBottom: '4px',
                                  fontWeight: 600
                                }}>
                                  {item.time}
                                </div>
                              )}
                              <div style={{
                                fontSize: '17px',
                                fontWeight: 700,
                                marginBottom: '4px',
                                letterSpacing: '-0.01em'
                              }}>
                                {item.title}
                              </div>
                              {item.note && (
                                <div style={{
                                  fontSize: '15px',
                                  color: 'light-dark(#86868b, #98989d)',
                                  marginBottom: '10px'
                                }}>
                                  {item.note}
                                </div>
                              )}
                              {item.lat && item.lng && (
                                <a
                                  href={getMapUrl(item.lat, item.lng, item.title)}
                                  target="_blank"
                                  rel="noreferrer"
                                  className="button"
                                  style={{
                                    display: 'inline-block',
                                    padding: '10px 16px',
                                    borderRadius: '10px',
                                    background: '#007AFF',
                                    color: '#ffffff',
                                    textDecoration: 'none',
                                    fontSize: '15px',
                                    fontWeight: 700,
                                    minHeight: '44px',
                                    lineHeight: '24px'
                                  }}
                                >
                                  📍 Open in {mapProvider === 'apple' ? 'Apple' : 'Google'} Maps
                                </a>
                              )}
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>

          <div style={{
            textAlign: 'center',
            padding: '24px 20px',
            color: 'light-dark(#86868b, #98989d)',
            fontSize: '13px'
          }}>
            <p>Tap any day to see details & map</p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
